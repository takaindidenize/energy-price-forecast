# Keep the daily forecast running while nobody works on the repository.
#
# GitHub disables scheduled workflows in a public repository after 60 days without repository
# activity, silently, and the dashboard would just stop updating. So when the latest commit is 50
# days old this raises the counter in .github/keepalive-count and commits it, leaving ten daily
# attempts before the limit. A real file change is used because GitHub's documentation does not
# define "activity".
#
# This has not yet been seen working across a real 60-day gap. Pushes made with GITHUB_TOKEN do not
# start other workflows, so this does not trigger CI.
#
# Test it from the Actions tab with "Run workflow" and days = 0, which adds one commit.
name: Keep the schedule enabled

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Commit when the latest commit is at least this many days old"
        required: false
        default: "50"
  schedule:
    - cron: "41 2 * * *"

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Raise the counter if the repository has been quiet
        env:
          MAX_AGE_DAYS: ${{ inputs.days || '50' }}
          COUNT_FILE: .github/keepalive-count
        run: |
          age=$(( ($(date -u +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "The latest commit is $age days old; the limit is $MAX_AGE_DAYS."
          if [ "$age" -lt "$MAX_AGE_DAYS" ]; then
            exit 0
          fi
          count=$(( $(cat "$COUNT_FILE" 2>/dev/null || echo 0) + 1 ))
          echo "$count" > "$COUNT_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$COUNT_FILE"
          git commit -m "Keep the daily schedule enabled (quiet period $count)"
          git push
