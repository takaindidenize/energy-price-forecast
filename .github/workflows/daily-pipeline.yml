# Daily forecast: ingest the latest data, forecast tomorrow for both markets, check accuracy,
# and publish the dashboard (src/price_forecast/report.py) to GitHub Pages.
#
# Storage: data/ (raw Parquet + warehouse.duckdb) is carried from run to run in the Actions cache.
# When the cache is empty (first run, or evicted after 7 days without a run) the job ingests the
# history again and the forecast history on the dashboard starts over; run it once by hand with
# `backfill_days` to refill it.
#
# History: the live models train on data from PF_START_MONTH (January 2025), not 2023 as in the
# README's backtest. On GitHub's shared runners each Open-Meteo request can take about a minute,
# so the weather is fetched one year per request and the history kept short; nearly two years is
# also what the 2025 backtest trained on, and recent data matters more after regime changes.
#
# Setup: the repository secrets EPIAS_USERNAME and EPIAS_PASSWORD (Settings → Secrets and
# variables → Actions; without them the Turkish market fails and Germany still runs), and for the
# dashboard Pages with "GitHub Actions" as the source (Settings → Pages), which on the free plan
# needs a public repository. While the repository is private the page is built but not deployed.
#
# Timing: a forecast has to exist before the day-ahead auctions close (12:00 CET in Germany, 12:30
# TRT in Turkey), or the next day's real prices are already out when the page is built. GitHub's
# schedule is best effort: with five slots from 03:17 UTC, the runs of 6 and 7 November 2026 started
# only at about 11:00 and 10:20 UTC, after Turkey's auction closed. So it is now scheduled six times
# from 00:17 UTC, off the busy top of the hour, and the `gate` job ends a run at once when today's
# forecast already succeeded. A failed run is tried again by the next slot. Whether the earlier
# slots help is not known yet, because GitHub does not show which slot a late run came from.
# All inputs exist by 00:17 UTC: the issue day's prices came out the afternoon before. An early run
# may see an older weather forecast than the 11:00 issue time of the backtests.
# Forecasts are stored with the configured issue time (11:00 local), not the moment the job ran;
# the dashboard shows the real time and whether it was before the auction closed. A late run cannot
# use the published prices (training and features stop at the issue day), but it does see a fresher
# weather forecast.
#
# GitHub disables schedules after 60 days without any repository activity; keepalive.yml adds an
# empty commit before that. If the schedule is off anyway, re-enable it on the Actions tab.
name: Daily forecast

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Issue day D (YYYY-MM-DD, default today UTC); forecasts are for D+1"
        required: false
      backfill_days:
        description: "Run for this many issue days ending at D (refills the dashboard history)"
        required: false
        default: "1"
  schedule:
    - cron: "17 0-5 * * *"

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  # Only the first successful run of the day forecasts. Started by hand, it always runs.
  gate:
    runs-on: ubuntu-latest
    outputs:
      day: ${{ steps.day.outputs.day }}
      run: ${{ github.event_name == 'workflow_dispatch' || steps.done.outputs.cache-hit != 'true' }}
    steps:
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - id: done
        uses: actions/cache/restore@v4
        with:
          path: .forecast-done
          key: forecast-done-${{ steps.day.outputs.day }}
          lookup-only: true

  forecast:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PF_DATA_DIR: ${{ github.workspace }}/data
      PF_START_MONTH: "2025-01"
      EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
      EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .

      - name: Restore data from the previous run
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Ingest the full history if there is none
        run: |
          echo "PF_END_MONTH=$(date -u +%Y-%m)" >> "$GITHUB_ENV"
          export PF_END_MONTH="$(date -u +%Y-%m)"
          if [ -d data/raw/prices ]; then
            echo "Data restored from the cache; the pipeline fetches the recent months itself."
            exit 0
          fi
          python -m price_forecast.ingestion.energy_charts
          python -m price_forecast.ingestion.weather --market de_lu
          python -m price_forecast.ingestion.weather --market tr
          python -m price_forecast.ingestion.epias || echo "::warning::EPİAŞ ingestion failed (secrets missing?)"

      - name: Forecast tomorrow
        id: pipeline
        continue-on-error: true  # one failed market must not stop the dashboard update
        env:
          ISSUE_DATE: ${{ inputs.date }}
          DAYS: ${{ inputs.backfill_days || '1' }}
        run: |
          if [ -n "$ISSUE_DATE" ]; then
            python -m price_forecast.pipeline --date "$ISSUE_DATE" --days "$DAYS"
          else
            python -m price_forecast.pipeline --days "$DAYS"
          fi

      - name: Check accuracy
        run: python -m price_forecast.monitor

      - name: Build the dashboard
        run: python -m price_forecast.report --out site

      - name: Save data for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Prepare today's done marker
        if: ${{ steps.pipeline.outcome == 'success' && !inputs.date }}
        run: touch .forecast-done

      - name: Mark today's forecast as done
        if: ${{ steps.pipeline.outcome == 'success' && !inputs.date }}
        uses: actions/cache/save@v4
        with:
          path: .forecast-done
          key: forecast-done-${{ needs.gate.outputs.day }}

      - name: Fail the run if a market failed
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::The pipeline failed for at least one market; see the 'Forecast tomorrow' step."
          exit 1

  deploy:
    needs: forecast
    # Pages on the free plan needs a public repository; while private, the page is still built
    # and kept as the run's "github-pages" artifact, just not deployed.
    if: ${{ !cancelled() && needs.forecast.result != 'skipped' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
